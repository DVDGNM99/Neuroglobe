repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: ["--select=E9,F63,F7,F82"]

  - repo: local
    hooks:
      - id: repository-hygiene
        name: reject large and generated Git artifacts
        entry: python -m pytest -q tests/test_repository_hygiene.py
        language: system
        pass_filenames: false
        always_run: true
