# --- AESTHETIC CONFIGURATION ---
aesthetics:
  show_axes: false
  whole_screen: false
  background_color: "white"
  screenshot_transparent_background: true
  default_alpha: 0.8 # Transparency for brain regions

# --- ALIGNMENT CONFIGURATION ---
alignment:
  # Native alignment assumes data is registered to the atlas.
  # Only rotation is kept for dataset-specific orientation fix.
  rotation_mode: "final_y_270"
  
  # --- MANUAL FINE TUNING ---
  # Small corrections if the native registration is slightly off.
  manual_shift:
    x: 0      # + Right, - Left
    y: 0      # + Down (Ventral), - Up (Dorsal)
    z: 0      # + Back (Caudal), - Front (Rostral)

  manual_rotation:
    x: 0
    y: 90
    z: 0