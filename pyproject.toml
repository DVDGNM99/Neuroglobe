[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroglobe"
version = "5.0.0"
description = "Allen CCF connectivity and gene-expression visualization tools"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "Proprietary"}
authors = [{name = "Dr. David Ganem"}]
dependencies = [
  "numpy>=1.23.5",
  "pandas>=1.5.3,<2",
  "PyYAML>=6",
]

[project.optional-dependencies]
miner = [
  "allensdk==2.16.2",
  "SimpleITK>=2",
  "tables>=3.9",
]
viewer = [
  "brainrender>=2.1.16",
  "brainglobe-atlasapi>=2.1",
  "dearpygui>=1.6",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "vedo>=2025.5.4",
  "vtk>=9.2.6",
]
desktop = ["customtkinter>=5"]
dev = [
  "build>=1.2,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "ruff==0.16.1",
]

[project.scripts]
neuroglobe-fetch = "neuroglobe.projections.miner.fetch:main"
neuroglobe-aggregate = "neuroglobe.projections.miner.aggregate:main"
neuroglobe-extract-tracts = "neuroglobe.projections.miner.extract_tracts:main"
neuroglobe-analysis = "neuroglobe.projections.miner.miner_analysis:main"
neuroglobe-viewer = "neuroglobe.projections.viewer.main:main"
neuroglobe-genetics-fetch = "neuroglobe.genetics.miner.fetch_genes:main"
neuroglobe-genetics-filter = "neuroglobe.genetics.miner.filter_volume:main"
neuroglobe-genetics-viewer = "neuroglobe.genetics.viewer.controller:main"
neuroglobe-stereotaxic = "neuroglobe.stereotaxic.gui:main"
neuroglobe-stereotaxic-render = "neuroglobe.stereotaxic.render:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuroglobe*"]

[tool.pytest.ini_options]
addopts = "-q --tb=short"
testpaths = ["projections/tests", "tests"]
markers = [
  "gui: interactive GUI tests",
  "integration: external SDK, atlas, or renderer tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
